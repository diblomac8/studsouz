#p1 .ghost,#p2 .ghost{top:40px;font-size:240px;line-height:1}
.slot.on .ghost{opacity:0}
.inner{position:relative;opacity:0;transform:translateY(40px) scale(.94);filter:blur(10px);transition:opacity .9s ease-out .15s,transform 1.1s cubic-bezier(.2,.8,.2,1) .15s,filter .9s ease-out .15s}
.slot.on .inner{opacity:1;transform:none;filter:none}
.place{font-style:italic;font-weight:400;font-size:40px;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac);text-shadow:0 0 14px rgba(240,180,255,.75),0 0 30px rgba(160,80,255,.5)}
#p0 .place{font-size:50px}
.name{display:inline-block;margin:10px auto 0;white-space:nowrap;font-weight:900;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;
  background:linear-gradient(172deg,#fff8e6 0%,#f0d7a6 28%,#b8915a 52%,#f5e3bd 70%,#9c7646 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1.5px rgba(255,236,200,.55);filter:drop-shadow(0 0 16px rgba(255,205,140,.45)) drop-shadow(0 4px 18px rgba(20,5,50,.8))}
#p0 .name{font-size:210px}
#p1 .name,#p2 .name{font-size:132px}
.pct{margin-top:14px;font-weight:600;line-height:1;color:var(--cream);font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(255,214,160,.55),0 0 50px rgba(190,120,255,.45)}
#p0 .pct{font-size:120px}
#p1 .pct,#p2 .pct{font-size:84px}
.cap{margin-top:12px;font-weight:400;font-size:26px;line-height:1.35;letter-spacing:.06em;text-transform:uppercase;color:rgba(246,231,198,.9);text-shadow:0 0 10px rgba(20,6,55,.95),0 0 26px rgba(20,6,55,.9)}
.cap b{display:block}
#p0 .cap{font-size:30px}
.cap b{font-weight:600;color:var(--cream)}
#total{position:absolute;left:0;right:0;top:898px;text-align:center;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,231,198,.78);opacity:0;transition:opacity 1.2s .9s}
#total b{font-weight:600;color:var(--cream)}
.s-done #total{opacity:1}
#flash{background:radial-gradient(40% 45% at 50% 42%,rgba(255,244,214,.9),rgba(255,214,160,.25) 45%,transparent 70%);opacity:0}
#flash.go{animation:fl 1.6s ease-out}
@keyframes fl{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff3d4;box-shadow:0 0 12px 3px rgba(255,220,160,.8)}

      var cap = s.querySelector('.cap');
      cap.appendChild(document.createTextNode(L('отметили зрителей', 'of viewers ticked it')));
      var b = document.createElement('b'); b.textContent = num(R.raw[f]) + ' ' + votesWord(R.raw[f]); cap.appendChild(b);
    }
    var t = $('total'); t.textContent = L('Проголосовало ', 'Votes cast: ');
    var tb = document.createElement('b'); tb.textContent = num(R.total) + (EN ? '' : ' ' + plural(R.total, 'зритель', 'зрителя', 'зрителей')); t.appendChild(tb);
    fitNames();
  }
  function fitNames() {                     // длинное название уменьшается, чтобы влезло в свою колонку
    [].forEach.call(document.querySelectorAll('.name'), function (n) {
      n.style.fontSize = '';
      var max = n.parentNode.parentNode.clientWidth - 10, fs = parseFloat(getComputedStyle(n).fontSize), guard = 0;
      while (n.offsetWidth > max && guard++ < 60) { fs *= .95; n.style.fontSize = fs + 'px'; }
    });
  }

  function countUp(el, to, suffix) {
    var t0 = performance.now(), d = 1500;
    (function fr(t) {
      var k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3);
      el.textContent = num(to * e) + suffix;
      if (k < 1) requestAnimationFrame(fr);
    })(t0);
  }
  function sparks(cx, cy, n) {
    for (var i = 0; i < n; i++) {
      var sp = document.createElement('span'); sp.className = 'spark';
      var a = Math.random() * Math.PI * 2, r = 220 + Math.random() * 520, sz = 4 + Math.random() * 9;
      sp.style.left = cx + 'px'; sp.style.top = cy + 'px'; sp.style.width = sp.style.height = sz + 'px';
      $('stage').appendChild(sp);
      sp.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: 'translate(' + Math.cos(a) * r + 'px,' + Math.sin(a) * r + 'px) scale(.2)', opacity: 0 }],
        { duration: 1400 + Math.random() * 1200, easing: 'cubic-bezier(.1,.7,.3,1)', fill: 'forwards' }).onfinish = (function (x) { return function () { x.remove(); }; })(sp);
    }
  }
  function show(i) {                         // i: 2 – третье место, 1 – второе, 0 – первое
    var s = $('p' + i); s.classList.add('on');
    countUp(s.querySelector('.pct'), R.pct[s.dataset.f], '%');
    if (i === 0) {
      document.body.classList.add('s-done');
      var fl = $('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
      sparks(960, 470, 70);
    } else sparks(i === 1 ? 350 : 1570, 540, 26);
  }
  function hide(i) { $('p' + i).classList.remove('on'); if (i === 0) document.body.classList.remove('s-done'); }

  function next() {
    if (!R) { help(L('Итоги ещё не опубликованы – экран подхватит их сам', 'Results are not published yet – the screen will pick them up'), 'err'); return; }
    if (step >= 3) return;
    document.body.classList.add('used');
    step++; show(3 - step);
  }
  function back() { if (step <= 0) return; hide(3 - step); step--; if (!step) document.body.classList.remove('used'); }
  function full() { var d = document; if (!d.fullscreenElement) { (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen || function () {}).call(d.documentElement); } else (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === ' ' || k === 'ArrowRight' || k === 'Enter' || k === 'PageDown' || k === 'ArrowDown') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'Backspace' || k === 'PageUp' || k === 'ArrowUp') { e.preventDefault(); back(); }
    else if (k === 'f' || k === 'F' || k === 'а' || k === 'А') full();
  });
  document.addEventListener('click', next);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); back(); });
  var idle = 0; document.addEventListener('mousemove', function () { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(function () { document.body.classList.add('idle'); }, 2000); });

  function ready(data, note) {
    R = data;
    var go = function () { fill(); help(note + keys, 'ok'); };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
  }

  /* откуда берутся итоги */
  if (OFFLINE) return ready(OFFLINE, L('Итоги в файле, интернет не нужен', 'Results are inside the file, no internet needed'));
  if (/[?&]demo/.test(Q)) return ready(DEMO_DATA, L('Демо: тестовые цифры', 'Demo: test figures'));
  help(L('Ждём публикацию итогов…', 'Waiting for the results…') + keys);
  function check() {
    fetch(API + (API.indexOf('?') < 0 ? '?' : '&') + 'a=results', { cache: 'no-store', credentials: 'omit' }).then(function (r) { return r.json(); }).then(function (r) {
      if (r.results) return ready(r.results, L('Итоги загружены', 'Results loaded'));
      help(L(r.state === 'open' ? 'Голосование идёт – ждём итоги…' : 'Ждём публикацию итогов…', r.state === 'open' ? 'Voting is open – waiting for results…' : 'Waiting for the results…') + keys);
      poll = setTimeout(check, 6000 + Math.random() * 3000);
    }, function () {
      help(L('Нет связи с сервером – пробую ещё. Если интернета нет, открой файл с пульта', 'No connection – retrying. Without internet use the file from the control panel') + keys, 'err');
      poll = setTimeout(check, 8000);
    });
  }
  fetch('/vote/config.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (c) {
    API = typeof c.api === 'string' && /^https:\/\/|^http:\/\/127\.0\.0\.1/.test(c.api) ? c.api : '';
    if (c.demo) return ready(DEMO_DATA, L('Демо: тестовые цифры', 'Demo: test figures'));
    if (API) check(); else help(L('Сервер не настроен', 'Server is not configured'), 'err');
  }, function () { help(L('Нет связи с сайтом – открой файл с пульта', 'No connection – use the file from the control panel'), 'err'); });
})();
</script>
</body>
</html>

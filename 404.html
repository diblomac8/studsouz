:root{--brand:#00ac1d;--ink:#06081c;--paper:#f1f3ff;--mute:#a5abd3;--neon:#45ff2e;--flare:#ff4724;--line:rgba(165,171,211,.18)}
*{box-sizing:border-box}
html{background:radial-gradient(circle 30vmax at calc(100% - 7vmax) 5vmax,rgb(69 255 46/.2),transparent),radial-gradient(circle 30vmax at 5vmax calc(100% - 1vmax),rgb(255 71 36/.2),transparent),var(--ink);min-height:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--paper);font:400 17px/1.6 Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.top{padding:22px clamp(16px,5vw,64px)}
.top a{display:inline-block}
.top a{color:var(--brand)}
.top svg,.top img{height:44px;width:auto;display:block;fill:currentColor}
main{flex:1;display:grid;place-items:center;padding:24px clamp(16px,5vw,64px) 64px}
.box{max-width:720px;width:100%;display:grid;gap:28px;justify-items:start}
.code{margin:0;font:900 clamp(96px,22vw,220px)/.82 Montserrat,sans-serif;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:2px var(--neon)}
h1{margin:0;font:900 clamp(28px,5vw,48px)/1.05 Montserrat,sans-serif;text-transform:uppercase}
.say{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.say img{width:144px;height:120px;image-rendering:pixelated;image-rendering:crisp-edges}
.bubble{position:relative;max-width:420px;padding:14px 18px;background:var(--paper);color:var(--ink);font-weight:600;font-size:16px;line-height:1.45;
  box-shadow:0 -4px 0 var(--paper),0 4px 0 var(--paper),-4px 0 0 var(--paper),4px 0 0 var(--paper),8px 10px 0 rgba(0,0,0,.4)}
@media (min-width:640px){.bubble{margin-bottom:70px}}
.bubble small{display:block;margin-top:8px;font-weight:400;color:#3a3f66}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.acts a{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border:1px solid var(--neon);color:var(--neon);text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.acts a.pri{background:var(--neon);color:var(--ink)}
.acts a:hover{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.acts a:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
footer{padding:20px clamp(16px,5vw,64px);border-top:1px solid var(--line);color:var(--mute);font-size:13px}
</style>
